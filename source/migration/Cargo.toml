[package]
edition = "2024"
name = "migration"
publish = false
rust-version = "1.85.0"
version = "0.1.0"

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
sea-orm = { version = "2.0.2", features = ["with-chrono", "with-uuid"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
uuid = { version = "1.26.0", features = ["v4"] }

[dependencies.sea-orm-migration]
features = [
    "runtime-tokio-rustls",
    "sqlx-postgres",
    "sqlx-mysql",
    "sqlx-sqlite",
]
version = "2.0.0"
